[package]
name = "notist-book"
version = "0.1.0"
edition = "2024"

[dependencies]
notist = { path = "../.." }
notist-html = { path = "../notist-html", features = ["highlight"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
tera = { version = "2.4", default-features = false, features = ["preserve_order"] }
percent-encoding = "2"

[dev-dependencies]
toml = "0.8"
tempfile = "3"
