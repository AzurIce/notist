[package]
name = "notist-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rowan = "0.17.0"
smallvec = "1"
percent-encoding = "2"
serde_json = "1"
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
