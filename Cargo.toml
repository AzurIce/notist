[package]
name = "notist"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/notist-cli", "crates/notist-observe", "crates/notist-pipeline", "crates/notist-eval", "crates/notist-syntax", "crates/notist-core", "crates/notist-html", "crates/notist-ssg", "modules/grammar", "tools/eval-bench"]

[dependencies]
notist-pipeline = { path = "crates/notist-pipeline" }
notist-syntax = { path = "crates/notist-syntax" }
notist-core = { path = "crates/notist-core", features = ["serde"] }
notist-html = { path = "crates/notist-html" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rowan = "0.17.0"
percent-encoding = "2"

[features]
default = ["command-extensions"]
command-extensions = ["notist-core/serde"]
serde = ["notist-core/serde"]
profiling = ["notist-pipeline/profiling"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
rayon = "1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"
