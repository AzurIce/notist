[package]
name = "notist"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[workspace]
members = [
    "crates/notist-core",
    "crates/notist-observe",
    "crates/notist-html",
    "crates/notist-ssg",
    "crates/notist-cli",
    "modules/grammar",
]

[dependencies]
notist-observe = { path = "crates/notist-observe" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
rayon = "1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
