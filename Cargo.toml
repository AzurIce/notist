[package]
name = "notist"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/notist-cli", "crates/notist-pipeline", "crates/notist-syntax", "crates/notist-core", "crates/notist-md", "crates/notist-lowering", "crates/notist-html", "crates/notist-ssg", "packages/grammar"]

[dependencies]
notist-pipeline = { path = "crates/notist-pipeline" }
notist-syntax = { path = "crates/notist-syntax" }
notist-core = { path = "crates/notist-core" }
notist-html = { path = "crates/notist-html" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rowan = "0.17.0"

[features]
default = []
serde = ["notist-core/serde"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[dev-dependencies]
insta = "1"
tempfile = "3"
