<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>构建流程与阶段耗时</title><style>
html,body{margin:0;padding:0}body{font-family:var(--font-sans,system-ui);color:var(--foreground,#1f2937);font-size:1rem}main{padding:0;max-width:100%}p{margin:0;line-height:1.5}.muted{color:var(--muted-foreground,#64748b);font-size:.8rem}.controls{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}.controls select{font:inherit;color:var(--foreground,#1f2937);background:var(--muted,#f1f5f9);border:1px solid var(--border,#cbd5e1);border-radius:var(--radius,.4rem);padding:.25rem .4rem;max-width:100%}.caption{margin:.4rem 0 .6rem}.stage{background:var(--muted,#f1f5f9);border-radius:var(--radius,.5rem);padding:.45rem .65rem}.heading{display:grid;grid-template-columns:1.25rem minmax(0,1fr) auto 3.2rem;gap:.4rem;align-items:center;font-size:.88rem}.ordinal{font-size:.72rem;color:var(--muted-foreground,#64748b)}.time{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}.share{font-size:.75rem;text-align:right;color:var(--muted-foreground,#64748b)}.track{height:5px;overflow:hidden;background:var(--border,#dbe2ea);border-radius:3px;margin-top:.35rem}.fill{height:5px;min-width:1px;width:var(--value);background:var(--tone,var(--chart-1,#3b82f6))}.arrow{height:14px;position:relative}.arrow:before{content:'';position:absolute;top:0;bottom:3px;left:50%;width:1px;background:var(--muted-foreground,#64748b)}.arrow:after{content:'';position:absolute;bottom:0;left:calc(50% - 3px);border-top:4px solid var(--muted-foreground,#64748b);border-left:3px solid transparent;border-right:3px solid transparent}.children{margin-top:.45rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.78rem}.subbox{padding:.3rem .45rem;background:var(--card,#fff);border-radius:.3rem;min-width:0}.subtime{font-variant-numeric:tabular-nums;font-weight:600}.smallnote{font-size:.73rem;color:var(--muted-foreground,#64748b);margin-top:.35rem;line-height:1.5}details{margin-top:.4rem}summary{cursor:pointer;font-size:.78rem;color:var(--muted-foreground,#64748b)}.publication{margin-top:.4rem;display:grid;grid-template-columns:1fr 1rem 1.2fr 1rem 1fr;gap:.25rem;align-items:stretch;text-align:center;font-size:.77rem}.publication .subbox{display:flex;flex-direction:column;justify-content:center;gap:.15rem}.step-arrow{align-self:center;color:var(--muted-foreground,#64748b)}.failure{color:var(--warning,#a16207)}.remainder{margin-top:.6rem}.remainder .heading{grid-template-columns:minmax(0,1fr) auto 3.2rem;font-size:.8rem}.foot{margin-top:.6rem;font-size:.75rem;color:var(--muted-foreground,#64748b);line-height:1.5}@media(max-width:430px){.heading{font-size:.81rem;grid-template-columns:1rem minmax(0,1fr) auto 2.7rem;gap:.25rem}.stage{padding:.4rem .5rem}.share{font-size:.7rem}.publication{font-size:.7rem;grid-template-columns:1fr .7rem 1.2fr .7rem 1fr;gap:.15rem}.subbox{padding:.3rem}.muted{font-size:.75rem}}
</style></head><body><main>
<div class="controls"><select id="workload" aria-label="选择完整负载"></select><span class="muted" id="totals"></span></div>
<p class="muted caption">成功重建路径（已有旧输出）。箭头表示逻辑先后，节点底条＝占全程比例；数值为全站累计，框高不代表耗时。</p>
<div id="flow"></div><div id="remainder" class="remainder"></div>
<p class="foot">统一使用 214de5f 的 detail 探针三轮均值，方便展开发布子项；不同于上一张 coarse 阶段表。父项已含子项，不重复相加。普通 CLI 中位数仅作参考。</p>
</main><script>
const DATA=__DATA__;
const stageNames=['发现、读源、准备扩展','分析／求值／文档装配','加载资源与模板','正文 HTML／链接／组件','构造共享模板上下文','逐页渲染模板、登记产物','构建收尾／释放 Vault','发布输出目录'];
const colors=['var(--chart-3,#f59e0b)','var(--chart-2,#14b8a6)','var(--chart-6,#64748b)','var(--chart-5,#ec4899)','var(--chart-4,#8b5cf6)','var(--chart-1,#3b82f6)','var(--chart-6,#64748b)','var(--chart-1,#3b82f6)'];
const el=(tag,text='',cls='')=>{let e=document.createElement(tag);e.textContent=text;e.className=cls;return e};
const ms=v=>v>=1000?(v/1000).toFixed(3)+' s':v.toFixed(v>=10?1:2)+' ms';
function bar(value,total,tone){let track=el('div','','track'),fill=el('div','','fill');fill.style.setProperty('--value',(100*value/total)+'%');fill.style.setProperty('--tone',tone);track.append(fill);return track}
function heading(title,value,total,index){let row=el('div','','heading');if(index!==undefined)row.append(el('span',String(index+1).padStart(2,'0'),'ordinal'));row.append(el('span',title),el('span',ms(value),'time'),el('span',(100*value/total).toFixed(1)+'%','share'));return row}
DATA.rows.forEach((r,i)=>{let o=el('option',r.title+' · '+r.pages.toLocaleString('zh-CN')+' 页');o.value=i;document.getElementById('workload').append(o)});
function draw(){let r=DATA.rows[Number(document.getElementById('workload').value)],flow=document.getElementById('flow');flow.replaceChildren();document.getElementById('totals').textContent='探针内 '+ms(r.total)+' ｜普通 CLI 中位数 '+(r.normal/1000).toFixed(3)+' s';
r.nodes.forEach((v,i)=>{if(i)flow.append(el('div','','arrow'));let card=el('section','','stage');card.append(heading(stageNames[i],v,r.total,i),bar(v,r.total,colors[i]));
if(i===1){let children=el('div','','children');children.append(el('span','分析全部页面 '+ms(r.analyze),'subbox'),el('span','→','step-arrow'),el('span','求值全部页面 '+ms(r.evaluate),'subbox'));card.append(children,el('p','另含路由、文档元信息等 '+ms(r.pipelineOther)+'，分散在本阶段。','smallnote'))}
if(i===6)card.append(el('p','站点收尾（含局部回收）'+ms(r.siteRelease)+' ＋ Vault '+ms(r.vaultRelease)+'；先于目录发布。','smallnote'));
if(i===7){let details=el('details');details.open=true;details.append(el('summary','展开发布内部流程'));let grid=el('div','','publication');let write=el('div','','subbox');write.append(el('span','完整写入暂存目录'),el('span',ms(r.write),'subtime'));let swap=el('div','','subbox');swap.append(el('span','旧目录 → 备份'),el('span','暂存目录 → 正式目录'),el('span','两次 rename，未单独计时','muted'));let clean=el('div','','subbox');clean.append(el('span','成功：删除旧目录'),el('span',ms(r.retired),'subtime'));grid.append(write,el('span','→','step-arrow'),swap,el('span','→','step-arrow'),clean);details.append(grid,el('p','其余 '+ms(r.publishOther)+'：目标检查、目录准备、两次 rename、临时句柄清理等合计；不是纯 rename 时间。','smallnote'),el('p','替换失败 → 尝试恢复旧目录（本轮未触发，无耗时样本）。两次 rename 不是严格原子交换。','smallnote failure'));card.append(details)}flow.append(card)});
let rest=document.getElementById('remainder');rest.replaceChildren(heading('跨阶段宿主／其余收尾',r.other,r.total),bar(r.other,r.total,colors[6]),el('p','前置与尾部未分段余量，不画成一个连续步骤；加上它才等于本图总计。','smallnote'))}
document.getElementById('workload').addEventListener('change',draw);draw();
</script></body></html>
