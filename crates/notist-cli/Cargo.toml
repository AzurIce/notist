[package]
name = "notist-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "notist"
path = "src/main.rs"

[features]
default = ["lsp"]
lsp = ["dep:tower-lsp", "dep:tokio"]

[dependencies]
notist = { path = "../.." }
notist-html = { path = "../notist-html" }
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.12"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
url = "2"
