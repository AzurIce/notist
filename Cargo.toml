[package]
name = "notist"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/notist-syntax"]

[dependencies]
notist-syntax = { path = "crates/notist-syntax" }
rowan = "0.17.0"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.12"

serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync", "time"] }

[features]
serde = ["dep:serde"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[dev-dependencies]
insta = "1"
