<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notist viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>notist viewer</h1>
  <select id="corpus"><option value="">（从 corpus 载入..）</option></select>
  <input id="path" value="README.not" aria-label="Source path">
  <input id="config-url" value="../packages/widgets/Notist.toml" aria-label="Project configuration URL">
  <button id="load-project">载入项目</button>
  <label><input type="checkbox" id="showws" checked> 空白字符</label>
</header>
<main>
  <section class="pane">
    <h2>editor</h2>
    <div class="editor">
      <pre id="tokens" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" wrap="off"></textarea>
    </div>
  </section>
  <section class="pane">
    <h2>cst</h2>
    <div id="tree" class="tree"></div>
  </section>
  <section class="pane">
    <h2>ast</h2>
    <div id="ast" class="tree"></div>
  </section>
  <section class="pane">
    <h2>ir₁</h2>
    <div id="ir1" class="tree"></div>
  </section>
  <section class="pane">
    <h2>ir₂</h2>
    <div id="ir2" class="tree"></div>
  </section>
  <section class="pane">
    <h2>core</h2>
    <div id="core" class="tree"></div>
  </section>
  <section class="pane preview-pane"><h2>html preview</h2><iframe id="preview" title="HTML preview"></iframe></section>
  <section class="pane diags-pane">
    <h2>diagnostics</h2>
    <div id="diags" class="tree diags"></div>
  </section>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
