[package]
name = "notist-grammar"
version = "0.1.0"
edition = "2024"
description = "Parse Notist's grammar notation and render SVG railroad diagrams"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
railroad = { version = "0.3.9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
